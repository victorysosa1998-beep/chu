        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --red: #c8102e; --red-dark: #9a0b22; --red-glow: rgba(200,16,46,0.25);
            --gold: #f0c842;
            --bg: #0a0a0b; --bg-card: #111113; --bg-card2: #161618;
            --border: rgba(255,255,255,0.07);
            --text: #f0f0f2; --text-muted: #6b6b75; --text-dim: #9999a8;
        }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        nav {
            background: rgba(10,10,11,0.88); backdrop-filter: blur(20px);

            padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between;
        }
        .nav-back { color: var(--red); font-weight: 700; font-size: 12px; letter-spacing: 0.08em;
            text-decoration: none; display: flex; align-items: center; gap: 8px; text-transform: uppercase; transition: color 0.2s; }
        .nav-back:hover { color: #ff1a3d; }
        .nav-brand { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.05em;
            color: var(--text); display: flex; align-items: center; gap: 10px; }
        .nav-brand .icon { color: var(--gold); }
        .nav-logo img { height: 36px; object-fit: contain; }

        .hero { position: relative; overflow: hidden; padding: 80px 24px 64px; }
        .hero-bg { position: absolute; inset: 0;
            background: radial-gradient(ellipse 70% 60% at 80% 50%, rgba(200,16,46,0.12) 0%, transparent 65%),
                        radial-gradient(ellipse 40% 50% at 0% 100%, rgba(240,200,66,0.05) 0%, transparent 60%); }
        .hero-grid { position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.016) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.016) 1px, transparent 1px);
            background-size: 48px 48px; }
        .hero-watermark { position: absolute; right: -10px; bottom: -20px;
            font-family: 'Bebas Neue', sans-serif; font-size: clamp(7rem, 20vw, 17rem);
            color: rgba(255,255,255,0.025); line-height: 1; pointer-events: none; letter-spacing: 0.04em; }
        .hero-inner { position: relative; z-index: 2; max-width: 1200px; margin: 0 auto; }
        .hero-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--red); display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .hero-eyebrow::before { content: ''; display: block; width: 28px; height: 1.5px; background: var(--red); }
        .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3.5rem, 10vw, 8rem);
            color: var(--text); line-height: 0.9; letter-spacing: 0.03em; }
        .hero-title span { color: var(--gold); }
        .hero-sub { margin-top: 20px; font-size: 15px; color: var(--text-dim); font-weight: 300; max-width: 520px; line-height: 1.7; }

        .filter-bar { background: rgba(17,17,19,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); padding: 0 24px;
            display: flex; overflow-x: auto; position: sticky; top: 64px; z-index: 90; }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-btn { background: none; border: none; padding: 18px 20px;
            font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted);
            cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .filter-btn:hover { color: var(--text); }
        .filter-btn.active { color: var(--red); border-bottom-color: var(--red); }

        .search-wrap { max-width: 1280px; margin: 0 auto; padding: 28px 24px 0; }
        .search-box { position: relative; max-width: 420px; }
        .search-box input { width: 100%; padding: 13px 16px 13px 44px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 100px; font-family: 'Inter', sans-serif; font-size: 13px;
            color: var(--text); outline: none; transition: border-color 0.2s; }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box input:focus { border-color: var(--red); }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 13px; }

        main { max-width: 1280px; margin: 0 auto; padding: 36px 24px 80px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.04em; color: var(--text); }
        .audio-count { font-size: 12px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
            background: var(--bg-card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 100px; }

        .audio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

        .audio-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px;
            overflow: hidden; transition: all 0.25s ease; position: relative; display: flex; flex-direction: column; }
        .audio-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--red), var(--gold), var(--red)); opacity: 0; transition: opacity 0.25s; }
        .audio-card:hover { transform: translateY(-4px); border-color: rgba(200,16,46,0.25); box-shadow: 0 16px 48px rgba(0,0,0,0.4); }
        .audio-card:hover::before { opacity: 1; }
        .audio-card.is-active { border-color: rgba(200,16,46,0.45); box-shadow: 0 0 0 1px rgba(200,16,46,0.2), 0 20px 60px rgba(0,0,0,0.5); transform: translateY(-2px); }
        .audio-card.is-active::before { opacity: 1; }

        .audio-card-top { padding: 22px 22px 0; display: flex; align-items: center; gap: 16px; }
        .audio-icon { width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; box-shadow: 0 6px 20px var(--red-glow); transition: all 0.3s; }
        .audio-card.is-active .audio-icon { animation: iconPulse 2s ease-in-out infinite; }
        @keyframes iconPulse { 0%,100%{box-shadow:0 6px 20px var(--red-glow)} 50%{box-shadow:0 6px 36px rgba(200,16,46,0.6)} }
        .audio-meta-top { min-width: 0; flex: 1; }
        .audio-series { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
        .audio-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 15px; color: var(--text); line-height: 1.3;
            overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .audio-body { padding: 16px 22px 22px; display: flex; flex-direction: column; flex: 1; }
        .audio-meta { display: flex; align-items: center; justify-content: space-between;
            font-size: 11px; color: var(--text-muted); margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
        .audio-pastor { display: flex; align-items: center; gap: 5px; }
        .audio-pastor i { color: var(--red); font-size: 9px; }
        .audio-desc { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 14px; }

        /* ── PLAYER ── */
        .player-outer { margin-bottom: 14px; }

        /* The actual YT iframe sits here, sized 1x1 but in-DOM and visible to browser */
        .yt-frame-holder {
            width: 1px; height: 1px; overflow: hidden;
            position: absolute; pointer-events: none;
        }
        .yt-frame-holder iframe { width: 1px; height: 1px; }

        .player-ui {
            background: var(--bg-card2); border: 1px solid var(--border);
            border-radius: 14px; overflow: hidden; transition: border-color 0.3s;
        }
        .player-ui.active { border-color: rgba(200,16,46,0.4); }

        /* Waveform */
        .waveform { display: flex; align-items: center; gap: 2.5px; height: 28px; padding: 0 16px;
            border-bottom: 1px solid var(--border); }
        .wb { width: 3px; border-radius: 3px; background: rgba(200,16,46,0.18);
              transform: scaleY(0.3); transform-origin: center; transition: background 0.3s; flex-shrink:0; }
        .player-ui.active .wb { background: var(--red); }
        .player-ui.active .wb.go { animation: wb var(--d,0.7s) ease-in-out infinite alternate; }
        @keyframes wb { from{transform:scaleY(0.2)} to{transform:scaleY(1)} }

        /* Controls */
        .player-controls { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
        .ctrl-btn { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 15px; box-shadow: 0 4px 16px var(--red-glow); transition: all 0.15s; }
        .ctrl-btn:hover { transform: scale(1.1); box-shadow: 0 6px 24px var(--red-glow); }
        .ctrl-btn:active { transform: scale(0.95); }

        .player-info { flex: 1; min-width: 0; }
        .player-status { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        .player-status.live { color: var(--red); }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red);
            display: none; animation: blink 1.1s infinite; }
        .player-status.live .live-dot { display: inline-block; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
        .player-time { font-size: 11px; color: var(--text-dim); margin-top: 3px; font-variant-numeric: tabular-nums; }

        /* Seekbar */
        .seekbar-wrap { padding: 0 16px 14px; }
        .seekbar-track { position: relative; width: 100%; height: 4px; background: rgba(255,255,255,0.07);
            border-radius: 100px; cursor: pointer; transition: height 0.15s; }
        .seekbar-track:hover { height: 6px; }
        .seekbar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--red), var(--gold));
            border-radius: 100px; pointer-events: none; transition: width 0.6s linear; }
        .seekbar-thumb { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%;
            background: #fff; box-shadow: 0 0 0 2px var(--red); transform: translateY(-50%);
            opacity: 0; transition: opacity 0.2s; pointer-events: none; left: 0; }
        .seekbar-track:hover .seekbar-thumb { opacity: 1; }

        /* No link */
        .no-link { display: flex; align-items: center; gap: 10px; padding: 13px 16px;
            background: var(--bg-card2); border-radius: 14px; border: 1px dashed rgba(255,255,255,0.08);
            font-size: 11px; color: var(--text-muted); font-style: italic; margin-bottom: 14px; }
        .no-link i { opacity: 0.4; }

        .empty-state { text-align: center; padding: 80px 20px; grid-column: 1/-1; }
        .empty-icon { font-size: 3rem; color: rgba(200,16,46,0.2); margin-bottom: 16px; }
        .empty-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--text); margin-bottom: 8px; }
        .empty-sub { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

        footer { background: var(--bg-card); border-top: 1px solid var(--border);
            padding: 28px 24px; text-align: center; font-size: 12px; color: var(--text-muted); }
        footer a { color: var(--text-muted); text-decoration: none; }
        footer a:hover { color: var(--red); }

        @media (max-width: 900px) {
            nav { padding: 0 16px; }
            .hero { padding: 56px 16px 48px; }
            .filter-bar, .search-wrap, main { padding-left: 16px; padding-right: 16px; }
            .audio-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        title: "Secret of Financial Dominion",

    //   date: "2026-06-11", category: "Thursday", youtubeId: "", description: "A powerful message." },
    {
        title: "The Power of a River",
        pastor: "Apostle Osaro Magnus",
        date: "2026-06-11", category: "Thursday",
        youtubeId: "2bYVFLbrngc", description: "A powerful message."
    },
];

const CATEGORY_LABELS = {
    sunday:'Sunday Service', healing:'Healing & Deliverance',
    communion:'Power Communion', convention:'Convention', Thursday:'Conference'
};

/* ════════════════════════════════
   PLAYER STATE
   ════════════════════════════════ */
// ytPlayers[id] = { player: YT.Player, state: 'idle'|'loading'|'playing'|'paused'|'ended' }
const ytPlayers = {};
let activeId = null;
let tickInterval = null;

/* Load YT API once */
window.onYouTubeIframeAPIReady = function() { /* ready flag set by existence of YT obj */ };
(function(){
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
})();

function ytReady() { return typeof YT !== 'undefined' && YT.Player; }

/* Create a YT.Player inside the card's holder div */
function createPlayer(cid, ytId) {
    const holder = document.getElementById('fh-' + cid);
    if (!holder) return;

    // inject a div for YT to replace
    const div = document.createElement('div');
    div.id = 'yp-' + cid;
    holder.appendChild(div);

    const player = new YT.Player('yp-' + cid, {
        width: '1', height: '1',
        videoId: ytId,
        playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1, enablejsapi: 1 },
        events: {
            onReady(e)        { e.target.playVideo(); },
            onStateChange(e)  { onState(cid, e.data); }
        }
    });

    ytPlayers[cid] = { player, ytId, state: 'loading' };
}

function onState(cid, data) {
    const P = YT.PlayerState;
    const entry = ytPlayers[cid];
    if (!entry) return;
    if      (data === P.PLAYING)   { entry.state = 'playing'; applyUI(cid, 'playing'); startTick(); }
    else if (data === P.PAUSED)    { entry.state = 'paused';  applyUI(cid, 'paused');  }
    else if (data === P.ENDED)     { entry.state = 'ended';   applyUI(cid, 'ended');   stopTick(); }
    else if (data === P.BUFFERING) { entry.state = 'loading'; applyUI(cid, 'loading'); }
}

function applyUI(cid, state) {
    const btn    = document.getElementById('cb-' + cid);
    const ui     = document.getElementById('ui-' + cid);
    const status = document.getElementById('st-' + cid);
    const card   = document.getElementById('ca-' + cid);
    if (!btn) return;

    // clear active from all
    document.querySelectorAll('.audio-card').forEach(c => c.classList.remove('is-active'));
    document.querySelectorAll('.player-ui').forEach(u => u.classList.remove('active'));
    document.querySelectorAll('.wb').forEach(b => b.classList.remove('go'));
    document.querySelectorAll('.player-status').forEach(s => s.classList.remove('live'));

    if (state === 'playing') {
        btn.innerHTML = '<i class="fas fa-pause"></i>';
        status.innerHTML = '<span class="live-dot"></span> Now Playing';
        status.classList.add('live');
        card && card.classList.add('is-active');
        ui   && ui.classList.add('active');
        ui   && ui.querySelectorAll('.wb').forEach(b => b.classList.add('go'));
        activeId = cid;
    } else if (state === 'paused') {
        btn.innerHTML = '<i class="fas fa-play"></i>';
        status.innerHTML = '<i class="fas fa-pause" style="font-size:8px;opacity:.6"></i>&nbsp; Paused — tap to resume';
        activeId = null;
    } else if (state === 'loading') {
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        status.innerHTML = 'Loading…';
    } else if (state === 'ended') {
        btn.innerHTML = '<i class="fas fa-redo" style="font-size:13px"></i>';
        status.innerHTML = 'Finished';
        activeId = null;
        updateBar(cid, 100);
    } else {
        btn.innerHTML = '<i class="fas fa-play"></i>';
        status.innerHTML = 'Tap to play';
    }
}

function startTick() {
    if (tickInterval) return;
    tickInterval = setInterval(() => {
        if (!activeId) return;
        const e = ytPlayers[activeId];
        if (!e || typeof e.player.getCurrentTime !== 'function') return;
        const cur = e.player.getCurrentTime() || 0;
        const dur = e.player.getDuration()    || 0;
        updateBar(activeId, dur > 0 ? (cur/dur)*100 : 0, cur, dur);
    }, 700);
}
function stopTick() { clearInterval(tickInterval); tickInterval = null; }

function updateBar(cid, pct, cur, dur) {
    const fill  = document.getElementById('sf-' + cid);
    const thumb = document.getElementById('sth-' + cid);
    const time  = document.getElementById('tm-' + cid);
    if (fill)  fill.style.width = pct + '%';
    if (thumb) thumb.style.left = pct + '%';
    if (time && cur !== undefined) time.textContent = fmt(cur) + (dur ? ' / ' + fmt(dur) : '');
}

function fmt(s) {
    s = Math.floor(s);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

/* Main button handler */
function handlePlay(cid, ytId) {
    if (!ytReady()) { alert('Player is still loading, please try again in a moment.'); return; }

    // Pause any other active player
    if (activeId && activeId !== cid) {
        const other = ytPlayers[activeId];
        if (other && other.player && typeof other.player.pauseVideo === 'function') {
            other.player.pauseVideo();
        }
        applyUI(activeId, 'paused');
        activeId = null;
    }

    const entry = ytPlayers[cid];
    if (!entry) {
        // First play — create player (autoplay fires in onReady)
        applyUI(cid, 'loading');
        createPlayer(cid, ytId);
    } else {
        const s = entry.player.getPlayerState();
        if (s === YT.PlayerState.PLAYING) {
            entry.player.pauseVideo();
        } else {
            entry.player.playVideo();
        }
    }
}

/* Seek on click */
function handleSeek(cid, e) {
    const entry = ytPlayers[cid];
    if (!entry || typeof entry.player.getDuration !== 'function') return;
    const track = e.currentTarget;
    const pct = Math.max(0, Math.min(1, (e.clientX - track.getBoundingClientRect().left) / track.offsetWidth));
    entry.player.seekTo(pct * entry.player.getDuration(), true);
}

/* Waveform bars */
const WH = [28,18,32,14,30,22,10,26,16,30,20,12,28,18,24];
const WD = [.65,.9,.7,1.1,.8,.6,1.0,.75,.85,.7,1.2,.9,.6,.8,1.0];
function waveBars() {
    return WH.map((h,i) => `<div class="wb" style="height:${h}px;--d:${WD[i]}s"></div>`).join('');
}

/* ════════════════════════════════
   FILTER / RENDER
   ════════════════════════════════ */
let currentFilter = 'all';
function filterAudio(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAudioSermons();
}
function esc(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s+'T00:00:00');
    return isNaN(d) ? s : d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function renderAudioSermons() {
    const grid   = document.getElementById('audioGrid');
    const search = (document.getElementById('searchInput')?.value||'').trim().toLowerCase();

    let list = audioSermons.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if (currentFilter !== 'all') list = list.filter(a => a.category === currentFilter);
    if (search) list = list.filter(a =>
        (a.title||'').toLowerCase().includes(search) ||
        (a.pastor||'').toLowerCase().includes(search));

    document.getElementById('audioCount').textContent =
        list.length ? `${list.length} Message${list.length===1?'':'s'}` : '';

    if (!list.length) {
        grid.innerHTML = `<div class="empty-state">
            <div class="empty-icon"><i class="fas fa-podcast"></i></div>
            <div class="empty-title">No Audio Messages Found</div>
            <div class="empty-sub">${audioSermons.length ? 'Try a different search or filter.' : 'Sermons will appear here once uploaded.'}</div>
        </div>`;
        return;
    }

    grid.innerHTML = list.map((a, idx) => {
        const catLabel = CATEGORY_LABELS[a.category] || 'Message';
        const cid  = 'c' + idx;
        const ytId = (a.youtubeId || '').trim();

        const player = ytId ? `
        <div class="player-outer">
            <!-- YT iframe lives here — 1×1 but in the DOM so API works -->
            <div class="yt-frame-holder" id="fh-${cid}"></div>
            <div class="player-ui" id="ui-${cid}">
                <div class="waveform">${waveBars()}</div>
                <div class="player-controls">
                    <button class="ctrl-btn" id="cb-${cid}"
                        onclick="handlePlay('${cid}','${ytId}')">
                        <i class="fas fa-play"></i>
                    </button>
                    <div class="player-info">
                        <div class="player-status" id="st-${cid}">Tap to play</div>
                        <div class="player-time" id="tm-${cid}">0:00</div>
                    </div>
                </div>
                <div class="seekbar-wrap">
                    <div class="seekbar-track" onclick="handleSeek('${cid}',event)">
                        <div class="seekbar-fill" id="sf-${cid}"></div>
                        <div class="seekbar-thumb" id="sth-${cid}"></div>
                    </div>
                </div>
            </div>
        </div>` : `
        <div class="no-link">
            <i class="fas fa-headphones"></i>
            <span>Audio coming soon</span>
        </div>`;

        return `
        <div class="audio-card" id="ca-${cid}">
            <div class="audio-card-top">
                <div class="audio-icon"><i class="fas fa-headphones"></i></div>
                <div class="audio-meta-top">
                    <div class="audio-series">${esc(catLabel)}</div>
                    <div class="audio-title">${esc(a.title)}</div>
                </div>
            </div>
            <div class="audio-body">
                <div class="audio-meta">
                    <span class="audio-pastor"><i class="fas fa-user"></i> ${esc(a.pastor)}</span>
                    <span>${esc(fmtDate(a.date))}</span>
                </div>
                ${a.description ? `<div class="audio-desc">${esc(a.description)}</div>` : ''}
                ${player}
            </div>
        </div>`;
    }).join('');
}

renderAudioSermons();
</script>
</body>
</html>
