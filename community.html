<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Feed | City of Champions</title>
    <link rel="icon" type="image/png" href="media/logo1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ember: #c8102e;
            --ember-dim: rgba(200,16,46,0.15);
            --gold: #f0a500;
            --gold-dim: rgba(240,165,0,0.15);
            --surface: #0a0a0b;
            --card: #18181c;
            --card-border: rgba(255,255,255,0.07);
            --text: #f0f0f4;
            --muted: #6b6b7a;
        }

        body { font-family: 'Inter', sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; }

        /* NAV */
        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10,10,11,0.92); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 60px;
        }
        nav a {
            color: var(--ember); font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 13px; letter-spacing: 0.05em;
            text-decoration: none; display: flex; align-items: center; gap: 8px; transition: color 0.2s;
        }
        nav a:hover { color: var(--gold); }
        .nav-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.1em; }
        .nav-logo { height: 36px; object-fit: contain; }

        /* HERO */
        .hero {
            position: relative; overflow: hidden;
            padding: 72px 24px 64px; text-align: center;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(200,16,46,0.2) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 85% 60%, rgba(240,165,0,0.07) 0%, transparent 60%);
        }
        .hero-eyebrow {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--ember-dim); border: 1px solid rgba(200,16,46,0.3);
            color: var(--ember); padding: 6px 16px; border-radius: 100px;
            font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
            text-transform: uppercase; margin-bottom: 20px; position: relative;
        }
        .hero h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(42px, 8vw, 72px); letter-spacing: 0.04em; line-height: 1;
            color: var(--text); position: relative; margin-bottom: 16px;
        }
        .hero h1 span { color: var(--ember); }
        .hero p { color: var(--muted); font-size: 16px; font-weight: 300; max-width: 480px; margin: 0 auto; position: relative; }

        /* LAYOUT */
        main { max-width: 760px; margin: 0 auto; padding: 0 20px 80px; }

        /* DASHBOARD SLOT */
        #userDashboard { margin-bottom: 24px; }

        /* POST FORM */
        .post-form {
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 24px 28px; margin-bottom: 28px;
            position: relative; overflow: hidden;
        }
        .post-form::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--ember), transparent);
        }
        .post-form-title {
            font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700;
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .post-form-title i { color: var(--ember); }

        /* TYPE PILLS */
        .type-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .post-type-btn {
            background: transparent; border: 1.5px solid var(--card-border);
            color: var(--muted); padding: 7px 16px; border-radius: 100px;
            font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; letter-spacing: 0.03em;
        }
        .post-type-btn:hover { border-color: var(--ember); color: var(--ember); }
        .post-type-btn.active { background: var(--ember-dim); border-color: var(--ember); color: var(--ember); }

        /* TEXTAREA */
        .post-textarea {
            width: 100%; background: rgba(255,255,255,0.04); border: 1.5px solid var(--card-border);
            border-radius: 12px; padding: 14px 16px; color: var(--text);
            font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6;
            resize: none; outline: none; transition: border-color 0.2s;
        }
        .post-textarea:focus { border-color: var(--ember); }
        .post-textarea::placeholder { color: var(--muted); }

        .post-form-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
        .char-count { font-size: 12px; color: var(--muted); }
        .btn-post {
            background: var(--ember); color: #fff; border: none;
            padding: 10px 24px; border-radius: 100px;
            font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        .btn-post:hover { background: #a00c24; transform: translateY(-1px); }
        .btn-post:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* FEED */
        .feed-empty {
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 56px 24px; text-align: center;
        }
        .feed-empty i { font-size: 40px; color: rgba(200,16,46,0.3); margin-bottom: 14px; display: block; }
        .feed-empty p { color: var(--muted); font-size: 14px; }

        /* FEED ITEM */
        .feed-item {
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 20px 22px; margin-bottom: 14px;
            transition: all 0.2s; position: relative; overflow: hidden;
            animation: fadeUp 0.4s ease both;
        }
        .feed-item:hover { border-color: rgba(200,16,46,0.2); transform: translateY(-1px); }

        /* TYPE ACCENT BAR */
        .feed-item[data-type="testimony"]   { border-left: 3px solid #f0a500; }
        .feed-item[data-type="prayer"]      { border-left: 3px solid #818cf8; }
        .feed-item[data-type="encouragement"]{ border-left: 3px solid #f59e0b; }
        .feed-item[data-type="praise"]      { border-left: 3px solid #34d399; }

        .feed-top { display: flex; align-items: flex-start; gap: 14px; }
        .avatar {
            width: 42px; height: 42px; border-radius: 12px;
            background: var(--ember-dim); border: 1px solid rgba(200,16,46,0.2);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--ember);
            flex-shrink: 0;
        }
        .feed-meta { flex: 1; min-width: 0; }
        .feed-meta-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .feed-name { font-weight: 700; font-size: 14px; color: var(--text); }
        .feed-badge {
            font-size: 10px; font-weight: 700; padding: 3px 10px;
            border-radius: 100px; letter-spacing: 0.05em;
        }
        .badge-testimony    { background: rgba(240,165,0,0.15);   color: #f0a500; }
        .badge-prayer       { background: rgba(129,140,248,0.15); color: #818cf8; }
        .badge-encouragement{ background: rgba(245,158,11,0.15);  color: #f59e0b; }
        .badge-praise       { background: rgba(52,211,153,0.12);  color: #34d399; }
        .feed-time { font-size: 12px; color: var(--muted); margin-left: auto; }

        .feed-content { color: rgba(240,240,244,0.82); font-size: 14px; line-height: 1.7; }

        .feed-actions { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
        .like-btn {
            background: rgba(255,255,255,0.04); border: 1.5px solid var(--card-border);
            color: var(--muted); padding: 6px 14px; border-radius: 100px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .like-btn:hover { border-color: #f43f5e; color: #f43f5e; }
        .like-btn.reacted { background: rgba(244,63,94,0.1); border-color: #f43f5e; color: #f43f5e; }
        .delete-btn {
            background: transparent; border: none; color: var(--muted);
            font-size: 12px; cursor: pointer; padding: 6px 10px;
            border-radius: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .delete-btn:hover { color: var(--ember); background: var(--ember-dim); }

        .comment-btn {
            background: rgba(255,255,255,0.04); border: 1.5px solid var(--card-border);
            color: var(--muted); padding: 6px 14px; border-radius: 100px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .comment-btn:hover { border-color: #818cf8; color: #818cf8; }
        .comment-btn.open { background: rgba(129,140,248,0.1); border-color: #818cf8; color: #818cf8; }

        .edit-btn {
            background: transparent; border: none; color: var(--muted);
            font-size: 12px; cursor: pointer; padding: 6px 10px;
            border-radius: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 5px;
            margin-left: auto;
        }
        .edit-btn:hover { color: var(--gold); background: var(--gold-dim); }

        .feed-edited { font-size: 11px; color: var(--muted); font-style: italic; margin-left: 6px; }

        /* EDIT BOX */
        .edit-box { margin-top: 4px; }
        .edit-textarea {
            width: 100%; background: rgba(255,255,255,0.04); border: 1.5px solid var(--gold);
            border-radius: 10px; padding: 10px 12px; color: var(--text);
            font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6;
            resize: vertical; outline: none; min-height: 70px;
        }
        .edit-actions { display: flex; gap: 8px; margin-top: 8px; }
        .btn-save-edit, .btn-cancel-edit {
            border: none; border-radius: 100px; padding: 7px 18px;
            font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 12px; cursor: pointer;
        }
        .btn-save-edit { background: var(--gold); color: #1a1300; }
        .btn-save-edit:hover { background: #c98800; }
        .btn-cancel-edit { background: rgba(255,255,255,0.06); color: var(--muted); }
        .btn-cancel-edit:hover { color: var(--text); }

        /* COMMENTS */
        .comments-section {
            display: none; margin-top: 14px; padding-top: 14px;
            border-top: 1px solid var(--card-border);
        }
        .comments-section.open { display: block; }
        .comments-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
        .comments-loading, .comments-empty { font-size: 13px; color: var(--muted); padding: 4px 0; }
        .comment-item { display: flex; gap: 10px; align-items: flex-start; }
        .comment-avatar {
            width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
            background: rgba(129,140,248,0.12); border: 1px solid rgba(129,140,248,0.25);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Bebas Neue', sans-serif; font-size: 14px; color: #818cf8;
        }
        .comment-body { flex: 1; min-width: 0; }
        .comment-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .comment-name { font-weight: 700; font-size: 12.5px; color: var(--text); }
        .comment-time { font-size: 11px; color: var(--muted); }
        .comment-text { font-size: 13px; line-height: 1.55; color: rgba(240,240,244,0.8); word-break: break-word; }
        .comment-compose { display: flex; gap: 8px; align-items: flex-end; }
        .comment-textarea {
            flex: 1; background: rgba(255,255,255,0.04); border: 1.5px solid var(--card-border);
            border-radius: 10px; padding: 9px 12px; color: var(--text);
            font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5;
            resize: none; outline: none; min-height: 38px; transition: border-color 0.2s;
        }
        .comment-textarea:focus { border-color: #818cf8; }
        .btn-comment-send {
            background: #818cf8; color: #fff; border: none; width: 38px; height: 38px;
            border-radius: 10px; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .btn-comment-send:hover { background: #6366f1; }

        /* TOAST */
        #toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(100px);
            z-index: 9999; background: #1a1a1e; border: 1px solid rgba(200,16,46,0.4);
            border-radius: 16px; padding: 14px 20px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
            opacity: 0; transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
            pointer-events: none; min-width: 280px; max-width: calc(100vw - 48px);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .toast-icon {
            width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
            background: linear-gradient(135deg, var(--ember), #8b0000);
            display: flex; align-items: center; justify-content: center; font-size: 16px;
        }
        .toast-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 13px; color: var(--text); }
        .toast-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
        .toast-close {
            background: none; border: none; color: var(--muted); font-size: 14px;
            cursor: pointer; padding: 4px; margin-left: auto; transition: color 0.2s;
        }
        .toast-close:hover { color: var(--text); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 560px) {
            .post-form { padding: 20px 18px; }
            .feed-item { padding: 16px 16px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html"><i class="fas fa-arrow-left"></i> </a>
    <span class="nav-title">City of Champions</span>
    <img src="media/logos.png" alt="COC" class="nav-logo" onerror="this.style.display='none'">
</nav>

<section class="hero">
    <div class="hero-eyebrow"><i class="fas fa-fire"></i> Community</div>
    <h1>The <span>COC Family</span></h1>
    <p>Celebrate, encourage, and connect with the City of Champions community.</p>
</section>

<main>

    <div id="userDashboard"></div>

    <!-- Post Form -->
    <div class="post-form">
        <div class="post-form-title"><i class="fas fa-pen-to-square"></i> Share Something</div>
        <div class="type-pills">
            <button class="post-type-btn active" onclick="setPostType('testimony')"  data-type="testimony"><i class="fas fa-star"></i> Testimony</button>
            <button class="post-type-btn"        onclick="setPostType('prayer')"     data-type="prayer"><i class="fas fa-hands-praying"></i> Prayer Request</button>
            <button class="post-type-btn"        onclick="setPostType('encouragement')" data-type="encouragement"><i class="fas fa-heart"></i> Encouragement</button>
            <button class="post-type-btn"        onclick="setPostType('praise')"     data-type="praise"><i class="fas fa-sun"></i> Praise Report</button>
        </div>
        <textarea class="post-textarea" id="postContent" rows="3" placeholder="What would you like to share with the community?"></textarea>
        <div class="post-form-footer">
            <span class="char-count" id="charCount">0 / 500</span>
            <button class="btn-post" onclick="submitPost()" id="submitPostBtn">
                <i class="fas fa-paper-plane"></i> Post
            </button>
        </div>
    </div>

    <!-- Feed -->
    <div id="feedContainer">
        <div class="feed-empty">
            <i class="fas fa-fire"></i>
            <p>Loading the community feed…</p>
        </div>
    </div>

</main>

<!-- Toast -->
<div id="toast">
    <div class="toast-icon">🔥</div>
    <div class="toast-body">
        <div class="toast-title" id="toastTitle">Posted!</div>
        <div class="toast-sub"   id="toastSub">Your post is now live.</div>
    </div>
    <button class="toast-close" onclick="hideToast()"><i class="fas fa-xmark"></i></button>
</div>

<script src="/scripts/coc-user.js" defer></script>
<script src="/scripts/coc-scripture.js" defer></script>
<script src="/scripts/coc-notify.js" defer></script>
<script src="/scripts/coc-dashboard.js" defer></script>
<script src="/scripts/coc-points.js" defer></script>

<script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, updateDoc, doc, increment, deleteDoc, query, orderBy, getDocs }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey:            "AIzaSyB2gU2QrpRnIevjhLqd1kTj-xsjiWBHGqQ",
        authDomain:        "joincoc.firebaseapp.com",
        projectId:         "joincoc",
        storageBucket:     "joincoc.firebasestorage.app",
        messagingSenderId: "322343274719",
        appId:             "1:322343274719:web:689229a5dd1ca422c9c16a"
    };

    const app    = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const auth   = getAuth(app);
    const db     = getFirestore(app);
    const colRef = collection(db, 'communityFeed');

    const ADMIN_UID = 'tAqH3t6DX4OxHadWurRcBFBhmQA3';
    const EDIT_WINDOW_MS = 2 * 60 * 1000; // posts can only be edited within 2 minutes of posting
    let currentUser = null;
    let allPosts    = [];
    let postType    = 'testimony';
    let toastTimer  = null;

    // Editing state
    let editingPostId  = null;
    let editDraftText  = '';

    // Comments state
    const expandedComments = new Set();   // postIds whose comment thread is open
    const commentsCache    = new Map();   // postId -> array of fetched comments
    const commentDrafts    = new Map();   // postId -> in-progress comment text

    // Lightweight per-browser identity used to know "your own post" for edit permissions.
    // This is a client-side convenience, not real authentication — see note below.
    function getLocalUserId() {
        let id = localStorage.getItem('coc_local_uid');
        if (!id) {
            id = 'u_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
            localStorage.setItem('coc_local_uid', id);
        }
        return id;
    }

    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }

    function canEdit(post) {
        if (!post || !post.creatorId || post.creatorId !== getLocalUserId()) return false;
        const created = post.createdAt?.toMillis ? post.createdAt.toMillis() : (post.createdAt ? new Date(post.createdAt).getTime() : null);
        if (!created) return false;
        return (Date.now() - created) < EDIT_WINDOW_MS;
    }

    onAuthStateChanged(auth, user => {
        if (user && user.uid === ADMIN_UID) {
            document.body.classList.add('is-admin');
            sessionStorage.setItem('coc_admin', 'true');
        } else {
            document.body.classList.remove('is-admin');
            sessionStorage.removeItem('coc_admin');
        }
    });

    // Toast
    function showToast(title, sub) {
        document.getElementById('toastTitle').textContent = title;
        document.getElementById('toastSub').textContent   = sub;
        document.getElementById('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, 4000);
    }
    window.hideToast = function() { document.getElementById('toast').classList.remove('show'); };

    // Post type
    window.setPostType = function(type) {
        postType = type;
        document.querySelectorAll('.post-type-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.type === type);
        });
    };

    // Submit post
    window.submitPost = async function() {
        const content = document.getElementById('postContent').value.trim();
        if (!content) { showToast('⚠️ Oops', 'Write something before posting.'); return; }

        let name = 'Friend';
        try {
            const user = window.COCUser?.getUser();
            if (user?.displayName) name = user.displayName;
        } catch {}

        const btn = document.getElementById('submitPostBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Posting…';

        try {
            await addDoc(colRef, { type: postType, name, content, likes: 0, commentCount: 0, creatorId: getLocalUserId(), createdAt: serverTimestamp() });
            document.getElementById('postContent').value = '';
            document.getElementById('charCount').textContent = '0 / 500';
            showToast('🔥 Posted!', 'Your post is now live in the community feed.');
            if (window.COCUser) window.COCUser.recordPost();
        } catch(err) {
            console.error(err);
            showToast('⚠️ Error', 'Could not post. Please try again.');
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Post';
    };

    // Like
    window.reactToPost = async function(postId, btn) {
        if (btn.classList.contains('reacted')) return;
        btn.classList.add('reacted');
        const span = btn.querySelector('.like-count');
        if (span) span.textContent = parseInt(span.textContent || 0) + 1;
        try {
            await updateDoc(doc(db, 'communityFeed', postId), { likes: increment(1) });
        } catch(err) { console.error(err); }
    };

    // Delete
    window.deletePost = async function(postId) {
        if (!confirm('Delete this post?')) return;
        try {
            await deleteDoc(doc(db, 'communityFeed', postId));
            showToast('🗑️ Deleted', 'Post has been removed.');
        } catch(err) {
            console.error(err);
            showToast('⚠️ Error', 'Could not delete. Make sure you are signed in as admin.');
        }
    };

    // Edit (post creator only, within the 2-minute window)
    window.startEdit = function(postId) {
        const post = allPosts.find(p => p.id === postId);
        if (!post) return;
        if (!canEdit(post)) {
            showToast('⏱️ Too late', 'You can only edit a post within 2 minutes of posting.');
            return;
        }
        editingPostId = postId;
        editDraftText = post.content || '';
        renderFeed(allPosts);
    };

    window.cancelEdit = function() {
        editingPostId = null;
        editDraftText = '';
        renderFeed(allPosts);
    };

    window.saveEdit = async function(postId) {
        const post = allPosts.find(p => p.id === postId);
        if (!post || !canEdit(post)) {
            showToast('⏱️ Too late', 'The 2-minute edit window has passed.');
            editingPostId = null;
            renderFeed(allPosts);
            return;
        }
        const textarea = document.getElementById(`editArea-${postId}`);
        const newContent = textarea ? textarea.value.trim() : '';
        if (!newContent) { showToast('⚠️ Oops', "A post can't be empty."); return; }
        try {
            await updateDoc(doc(db, 'communityFeed', postId), { content: newContent, editedAt: serverTimestamp() });
            showToast('✏️ Updated', 'Your post has been edited.');
        } catch(err) {
            console.error(err);
            showToast('⚠️ Error', 'Could not save changes.');
        }
        editingPostId = null;
        editDraftText = '';
        renderFeed(allPosts);
    };

    // Comments
    window.toggleComments = function(postId, btn) {
        const section = document.getElementById(`comments-${postId}`);
        if (!section) return;
        if (expandedComments.has(postId)) {
            const ta = document.getElementById(`commentInput-${postId}`);
            if (ta) commentDrafts.set(postId, ta.value);
            expandedComments.delete(postId);
            section.classList.remove('open');
            if (btn) btn.classList.remove('open');
        } else {
            expandedComments.add(postId);
            section.classList.add('open');
            if (btn) btn.classList.add('open');
            loadComments(postId);
        }
    };

    window.submitComment = async function(postId) {
        const textarea = document.getElementById(`commentInput-${postId}`);
        const content = textarea ? textarea.value.trim() : '';
        if (!content) return;

        let name = 'Friend';
        try {
            const user = window.COCUser?.getUser();
            if (user?.displayName) name = user.displayName;
        } catch {}

        try {
            await addDoc(collection(db, 'communityFeed', postId, 'comments'), {
                name, content, creatorId: getLocalUserId(), createdAt: serverTimestamp()
            });
            await updateDoc(doc(db, 'communityFeed', postId), { commentCount: increment(1) });
            commentDrafts.delete(postId);
            if (textarea) textarea.value = '';
            await loadComments(postId);
        } catch(err) {
            console.error(err);
            showToast('⚠️ Error', 'Could not post comment.');
        }
    };

    async function loadComments(postId) {
        const listEl = document.getElementById(`commentsList-${postId}`);
        if (listEl) listEl.innerHTML = '<div class="comments-loading">Loading comments…</div>';
        try {
            const q = query(collection(db, 'communityFeed', postId, 'comments'), orderBy('createdAt', 'asc'));
            const snap = await getDocs(q);
            const comments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            commentsCache.set(postId, comments);
            renderComments(postId, comments);
        } catch(err) {
            console.error(err);
            if (listEl) listEl.innerHTML = '<div class="comments-empty">Could not load comments.</div>';
        }
    }

    function renderComments(postId, comments) {
        const listEl = document.getElementById(`commentsList-${postId}`);
        if (!listEl) return;
        if (!comments.length) {
            listEl.innerHTML = '<div class="comments-empty">No comments yet — be the first to reply.</div>';
            return;
        }
        listEl.innerHTML = comments.map(c => `
            <div class="comment-item">
                <div class="comment-avatar">${escapeHTML((c.name || '?').charAt(0).toUpperCase())}</div>
                <div class="comment-body">
                    <div class="comment-meta">
                        <span class="comment-name">${escapeHTML(c.name || 'Anonymous')}</span>
                        <span class="comment-time">${timeAgo(c.createdAt)}</span>
                    </div>
                    <p class="comment-text">${escapeHTML(c.content || '')}</p>
                </div>
            </div>
        `).join('');
    }

    // Helpers
    const BADGE = {
        testimony:    ['badge-testimony',     '<i class="fas fa-star"></i> Testimony'],
        prayer:       ['badge-prayer',        '<i class="fas fa-hands-praying"></i> Prayer Request'],
        encouragement:['badge-encouragement', '<i class="fas fa-heart"></i> Encouragement'],
        praise:       ['badge-praise',        '<i class="fas fa-sun"></i> Praise Report']
    };

    function timeAgo(ts) {
        if (!ts) return 'just now';
        const d    = ts.toDate ? ts.toDate() : new Date(ts);
        const diff = Date.now() - d.getTime();
        if (diff < 60000)    return 'just now';
        if (diff < 3600000)  return Math.floor(diff/60000)   + 'm ago';
        if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
        return Math.floor(diff/86400000) + 'd ago';
    }

    function renderFeed(posts) {
        const container = document.getElementById('feedContainer');

        // Preserve any text the user is mid-typing before we wipe the DOM
        expandedComments.forEach(postId => {
            const ta = document.getElementById(`commentInput-${postId}`);
            if (ta) commentDrafts.set(postId, ta.value);
        });
        if (editingPostId) {
            const ta = document.getElementById(`editArea-${editingPostId}`);
            if (ta) editDraftText = ta.value;
        }

        if (!posts || !posts.length) {
            container.innerHTML = `
                <div class="feed-empty">
                    <i class="fas fa-fire"></i>
                    <p>No posts yet — be the first to share something with the community!</p>
                </div>`;
            return;
        }
        const isAdmin = document.body.classList.contains('is-admin');
        container.innerHTML = posts.map(post => {
            const [badgeClass, badgeLabel] = BADGE[post.type] || ['badge-testimony', post.type];
            const initial = post.name ? post.name.charAt(0).toUpperCase() : '?';
            const inEditMode = editingPostId === post.id && canEdit(post);

            const contentHTML = inEditMode ? `
                <div class="edit-box">
                    <textarea class="edit-textarea" id="editArea-${post.id}" maxlength="500">${escapeHTML(post.content)}</textarea>
                    <div class="edit-actions">
                        <button class="btn-save-edit" onclick="saveEdit('${post.id}')">Save</button>
                        <button class="btn-cancel-edit" onclick="cancelEdit()">Cancel</button>
                    </div>
                </div>
            ` : `<p class="feed-content">${post.content}</p>`;

            const editBtnHTML = (!inEditMode && canEdit(post))
                ? `<button class="edit-btn" onclick="startEdit('${post.id}')"><i class="fas fa-pen"></i> Edit</button>`
                : '';

            const editedTagHTML = post.editedAt ? `<span class="feed-edited">(edited)</span>` : '';

            return `
                <div class="feed-item" data-type="${post.type || 'testimony'}">
                    <div class="feed-top">
                        <div class="avatar">${initial}</div>
                        <div class="feed-meta">
                            <div class="feed-meta-top">
                                <span class="feed-name">${post.name || 'Anonymous'}</span>
                                <span class="feed-badge ${badgeClass}">${badgeLabel}</span>
                                <span class="feed-time">${timeAgo(post.createdAt)}</span>
                                ${editedTagHTML}
                            </div>
                            ${contentHTML}
                            <div class="feed-actions">
                                <button class="like-btn" onclick="reactToPost('${post.id}', this)">
                                    <i class="fas fa-heart"></i> <span class="like-count">${post.likes || 0}</span>
                                </button>
                                <button class="comment-btn" onclick="toggleComments('${post.id}', this)">
                                    <i class="fas fa-comment"></i> <span class="comment-count">${post.commentCount || 0}</span>
                                </button>
                                ${editBtnHTML}
                                ${isAdmin ? `<button class="delete-btn" onclick="deletePost('${post.id}')"><i class="fas fa-trash-alt"></i> Delete</button>` : ''}
                            </div>
                            <div class="comments-section" id="comments-${post.id}">
                                <div class="comments-list" id="commentsList-${post.id}"></div>
                                <div class="comment-compose">
                                    <textarea class="comment-textarea" id="commentInput-${post.id}" rows="1" maxlength="300" placeholder="Write a comment…"></textarea>
                                    <button class="btn-comment-send" onclick="submitComment('${post.id}')"><i class="fas fa-paper-plane"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        // Re-open comment threads that were already expanded, restoring any cached
        // comments and draft text the user hadn't sent yet.
        expandedComments.forEach(postId => {
            const section = document.getElementById(`comments-${postId}`);
            const btn = container.querySelector(`.comment-btn[onclick^="toggleComments('${postId}'"]`);
            if (section) section.classList.add('open');
            if (btn) btn.classList.add('open');
            const cached = commentsCache.get(postId);
            if (cached) renderComments(postId, cached);
            else loadComments(postId);
            const ta = document.getElementById(`commentInput-${postId}`);
            if (ta && commentDrafts.has(postId)) ta.value = commentDrafts.get(postId);
        });

        // Restore in-progress edit text
        if (editingPostId) {
            const ta = document.getElementById(`editArea-${editingPostId}`);
            if (ta && editDraftText) ta.value = editDraftText;
        }
    }

    // Char count
    document.getElementById('postContent').addEventListener('input', function() {
        const len = this.value.length;
        document.getElementById('charCount').textContent = `${len} / 500`;
        if (len > 500) this.value = this.value.slice(0, 500);
    });

    function initFeed() {
        if (window.COCDashboard) window.COCDashboard.renderUserDashboard('userDashboard');
        if (window.COCUser) {
            const user = window.COCUser.getUser();
            if (user?.displayName) window.COCUser.recordVisit();
        }
        try {
            onSnapshot(colRef, snap => {
                allPosts = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.createdAt?.toMillis?.() ?? 0) - (a.createdAt?.toMillis?.() ?? 0));
                renderFeed(allPosts);
            }, err => {
                console.error('Feed error:', err);
                renderFeed([]);
            });
        } catch(err) {
            console.error(err);
            renderFeed([]);
        }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initFeed);
    else initFeed();

    window.addEventListener('coc-auth-ready', () => renderFeed(allPosts));
</script>

</body>
</html>
