<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        :root {
            --safety-yellow: #fdd835;
            --dark-bg: #1a1a1a;
            --text-light: #ffffff;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        /* The Animated Worker Scene */
        .animation-wrapper {
            position: relative;
            width: 200px;
            height: 150px;
            margin: 0 auto 30px;
        }

        /* Construction Cone */
        .cone {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 100px;
            background: var(--safety-yellow);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            border-bottom: 10px solid #333;
        }

        .cone::after {
            content: '';
            position: absolute;
            top: 30%;
            left: 0;
            width: 100%;
            height: 20px;
            background: white;
            opacity: 0.8;
        }

        /* The Worker (Stylized Emoji/Icon) */
        .worker {
            font-size: 80px;
            position: absolute;
            bottom: 20px;
            left: 25%;
            animation: bounce 2s ease-in-out infinite;
        }

        .worker-right {
            font-size: 80px;
            position: absolute;
            bottom: 20px;
            right: 25%;
            animation: bounce 2s ease-in-out infinite 1s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(10deg); }
        }

        /* Text Styles */
        h1 {
            font-size: 3rem;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .highlight {
            color: var(--safety-yellow);
        }

        p {
            font-size: 1.2rem;
            opacity: 0.8;
            max-width: 500px;
            margin: 0 auto 30px;
        }

        /* Progress Bar */
        .loader-bar {
            width: 300px;
            height: 8px;
            background: #333;
            margin: 0 auto;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .loader-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 60%;
            background: var(--safety-yellow);
            box-shadow: 0 0 15px var(--safety-yellow);
            animation: progress 4s linear infinite;
        }

        @keyframes progress {
            0% { left: -100%; width: 30%; }
            50% { width: 50%; }
            100% { left: 100%; width: 30%; }
        }

        /* Safety Tape Decorations */
        .tape {
            position: absolute;
            width: 120%;
            height: 40px;
            background: repeating-linear-gradient(
                45deg,
                var(--safety-yellow),
                var(--safety-yellow) 20px,
                #000 20px,
                #000 40px
            );
            z-index: -1;
            opacity: 0.1;
        }

        .tape-top { top: 10%; transform: rotate(-5deg); }
        .tape-bottom { bottom: 10%; transform: rotate(5deg); }

    </style>
</head>
<body>

    <div class="tape tape-top"></div>
    <div class="tape tape-bottom"></div>

    <div class="container">
        <div class="animation-wrapper">
            <div class="worker">👷‍♂️</div>
            <div class="cone"></div>
            <div class="worker-right">🚧</div>
        </div>

        <h1>Webpage <span class="highlight">Under Construction</span></h1>
        <p>Our digital architects are currently laying down some heavy-duty code. We'll be back online shortly with something amazing.</p>
        
        <div class="loader-bar">
            <div class="loader-fill"></div>
        </div>
    </div>

</body>
</html>
