<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="media/logo1.png">
    <title>Testimonies | City of Champion Fire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        h1, h2, h3, .font-outfit { font-family: 'Outfit', sans-serif; }
        
        /* ── ADMIN DELETE BUTTON ── */
        .admin-delete-btn {
            display: none;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .admin-delete-btn:hover { background: #b91c1c; color: #fff; border-color: #b91c1c; }
        body.is-admin .admin-delete-btn { display: inline-flex; align-items: center; gap: 5px; }

        /* Admin badge in nav */
        .admin-badge {
            display: none;
            background: #b91c1c;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
        }
        body.is-admin .admin-badge { display: inline-block; }

        /* ── CUSTOM TOAST ── */
        #coc-toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 9999;
            background: linear-gradient(135deg, #0a0a0a, #1a0505);
            border: 1px solid rgba(185,28,28,0.4);
            border-radius: 18px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(185,28,28,0.15);
            opacity: 0;
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            min-width: 300px;
            max-width: calc(100vw - 48px);
        }
        #coc-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .coc-toast-icon {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #b91c1c, #7f1d1d);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            color: #fcd34d;
            box-shadow: 0 4px 14px rgba(185,28,28,0.4);
        }
        .coc-toast-body { min-width: 0; }
        .coc-toast-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 13px;
            color: #fff;
            letter-spacing: -0.01em;
            margin-bottom: 2px;
        }
        .coc-toast-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-style: italic;
            line-height: 1.4;
        }
        .coc-toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            padding: 4px;
            transition: color 0.2s;
        }
        .coc-toast-close:hover { color: rgba(255,255,255,0.7); }
    </style>
</head>
<body>

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-red-700 font-bold flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> BACK TO HOME
            </a>
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-extrabold uppercase tracking-tighter">Share Your Victory</h1>
                <span class="admin-badge">Admin</span>
            </div>
            <button onclick="cocAdminLogout()" class="admin-delete-btn" style="display:none;" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
            <!-- Hidden admin dot -->
            <span onclick="cocAdminDot()" style="cursor:default;color:rgba(0,0,0,0.04);font-size:18px;line-height:1;user-select:none;position:absolute;right:8px;bottom:4px;" title="">.</span>
        </div>
    </nav>

    <!-- Custom Toast Notification -->
    <div id="coc-toast">
        <div class="coc-toast-icon">🔥</div>
        <div class="coc-toast-body">
            <div class="coc-toast-title">Testimony Shared!</div>
            <div class="coc-toast-sub">May the Lord give you more reasons to testify 🙌</div>
        </div>
        <button class="coc-toast-close" onclick="cocHideToast()"><i class="fas fa-times"></i></button>
    </div>

    <main class="container mx-auto px-6 py-12 max-w-6xl">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            
            <div class="lg:col-span-1">
                <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 sticky top-24">
                    <h2 class="text-2xl font-bold mb-2">Post Testimony</h2>
                    <p class="text-gray-500 text-sm mb-6">Let the world hear what God has done for you.</p>
                    
                    <form id="testimonyForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Full Name</label>
                            <input type="text" id="userName" required placeholder="Enter your name" 
                                class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-red-700 focus:ring-0 transition outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Your Story</label>
                            <textarea id="userTestimony" required rows="5" placeholder="What is your testimony?" 
                                class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-red-700 focus:ring-0 transition outline-none resize-none"></textarea>
                        </div>
                        <button type="submit" id="submitBtn" class="w-full bg-red-700 text-white font-bold py-4 rounded-xl hover:bg-black transition shadow-lg flex items-center justify-center gap-2">
                            <span>SHARE TESTIMONY</span>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-3xl font-extrabold tracking-tight">Recent Testimonies</h2>
                    <span id="count" class="bg-red-100 text-red-700 px-4 py-1 rounded-full text-xs font-bold uppercase">Loading...</span>
                </div>

                <div id="testimoniesList" class="space-y-6">
                    <div class="animate-pulse flex space-x-4">
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                            <div class="space-y-2">
                                <div class="h-4 bg-gray-200 rounded"></div>
                                <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        let cocToastTimer = null;
        function cocShowToast() {
            const toast = document.getElementById('coc-toast');
            toast.classList.add('show');
            clearTimeout(cocToastTimer);
            cocToastTimer = setTimeout(() => cocHideToast(), 5000);
        }
        function cocHideToast() {
            document.getElementById('coc-toast').classList.remove('show');
        }

        /* ── ADMIN SESSION ── */
        const isAdmin = sessionStorage.getItem('coc_admin') === 'true';
        if (isAdmin) {
            document.body.classList.add('is-admin');
            const lb = document.getElementById('logoutBtn');
            if (lb) lb.style.display = 'inline-flex';
        }
        function cocAdminDot() {
            if (isAdmin) { cocAdminLogout(); }
            else {
                sessionStorage.setItem('coc_admin_return', 'testimonies.html');
                window.location.href = 'admin-login.html';
            }
        }
        function cocAdminLogout() {
            if (confirm('Sign out of admin mode?')) {
                sessionStorage.removeItem('coc_admin');
                sessionStorage.removeItem('coc_admin_return');
                location.reload();
            }
        }
    </script>

    <script type="module">
        import { initializeApp }          from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAnalytics }           from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";
        import { getAuth, onAuthStateChanged, signOut }
                                          from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, deleteDoc, doc }
                                          from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey:            "AIzaSyB2gU2QrpRnIevjhLqd1kTj-xsjiWBHGqQ",
            authDomain:        "joincoc.firebaseapp.com",
            projectId:         "joincoc",
            storageBucket:     "joincoc.firebasestorage.app",
            messagingSenderId: "322343274719",
            appId:             "1:322343274719:web:689229a5dd1ca422c9c16a",
            measurementId:     "G-V0HL0CDXXD"
        };

        const app  = initializeApp(firebaseConfig);
        getAnalytics(app);
        const auth   = getAuth(app);
        const db     = getFirestore(app);
        const colRef = collection(db, 'testimonies');

        const ADMIN_UID = 'tAqH3t6DX4OxHadWurRcBFBhmQA3';

        // Watch Firebase Auth state — show admin UI only if UID matches
        onAuthStateChanged(auth, user => {
            if (user && user.uid === ADMIN_UID) {
                sessionStorage.setItem('coc_admin', 'true');
                document.body.classList.add('is-admin');
                const lb = document.getElementById('logoutBtn');
                if (lb) lb.style.display = 'inline-flex';
            } else {
                document.body.classList.remove('is-admin');
                sessionStorage.removeItem('coc_admin');
                const lb = document.getElementById('logoutBtn');
                if (lb) lb.style.display = 'none';
            }
        });

        // Expose logout so inline onclick can reach it
        window.cocAdminLogout = async function() {
            if (!confirm('Sign out of admin mode?')) return;
            await signOut(auth);
            sessionStorage.removeItem('coc_admin');
            sessionStorage.removeItem('coc_admin_return');
            location.reload();
        };

        /* ── SUBMIT ── */
        document.getElementById('testimonyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>&nbsp; POSTING...';

            try {
                await addDoc(colRef, {
                    name:      document.getElementById('userName').value.trim(),
                    content:   document.getElementById('userTestimony').value.trim(),
                    createdAt: serverTimestamp()
                });
                document.getElementById('testimonyForm').reset();
                cocShowToast();
            } catch (err) {
                console.error('Error posting testimony:', err);
                alert('Something went wrong. Please try again.');
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>SHARE TESTIMONY</span> <i class="fas fa-paper-plane"></i>';
        });

        /* ── REAL-TIME FEED ── */
        const q = query(colRef, orderBy('createdAt', 'desc'));

        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('testimoniesList');
            const countBadge = document.getElementById('count');

            if (snapshot.empty) {
                list.innerHTML = '<p class="text-center text-gray-400 py-10">No testimonies yet. Be the first to share!</p>';
                countBadge.innerText = '0 STORIES';
                return;
            }

            let html = '';
            snapshot.docs.forEach(docSnap => {
                const data  = docSnap.data();
                const docId = docSnap.id;
                const date  = data.createdAt
                    ? data.createdAt.toDate().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
                    : 'Just now';

                const safeName    = data.name.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const safeContent = data.content.replace(/</g, '&lt;').replace(/>/g, '&gt;');

                html += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 testimony-card" id="tc-${docId}">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-bold text-lg text-gray-900">${safeName}</h3>
                                <p class="text-xs text-gray-400 font-bold uppercase tracking-widest">${date}</p>
                            </div>
                            <div style="display:flex;align-items:center;gap:10px;">
                                <button class="admin-delete-btn" onclick="deleteTestimony('${docId}')">
                                    <i class="fas fa-trash-alt"></i> Delete
                                </button>
                                <div class="text-red-700 opacity-20 text-3xl">
                                    <i class="fas fa-quote-right"></i>
                                </div>
                            </div>
                        </div>
                        <p class="text-gray-600 leading-relaxed italic">"${safeContent}"</p>
                    </div>`;
            });

            list.innerHTML = html;
            countBadge.innerText = `${snapshot.size} ${snapshot.size === 1 ? 'STORY' : 'STORIES'}`;
        }, (error) => {
            console.error('Firestore error:', error);
            document.getElementById('testimoniesList').innerHTML =
                '<p class="text-center text-red-400 py-10">Could not load testimonies. Please refresh.</p>';
        });

        /* ── DELETE (Firebase Auth required by Firestore rules) ── */
        window.deleteTestimony = async function(docId) {
            if (!confirm('Delete this testimony? This cannot be undone.')) return;
            try {
                await deleteDoc(doc(db, 'testimonies', docId));
            } catch (err) {
                console.error('Delete error:', err);
                alert('Could not delete. Make sure you are signed in as admin.');
            }
        };
    </script>
</body>
</html>
