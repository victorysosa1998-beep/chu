<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Scriptures | COC Admin</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, Inter, sans-serif;
            background: #0a0a0b; color: #f0f0f2;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            background: #111113; border: 1px solid rgba(200,16,46,0.25);
            border-radius: 20px; padding: 40px 36px; max-width: 440px; width: 100%;
            text-align: center;
        }
        h1 { font-size: 1.4rem; margin-bottom: 10px; }
        p { color: #9999a8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        button {
            background: #c8102e; color: #fff; border: none;
            padding: 14px 28px; border-radius: 100px; font-size: 14px; font-weight: 700;
            letter-spacing: 0.05em; cursor: pointer; width: 100%;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #9a0b22; }
        #status {
            margin-top: 20px; padding: 14px 16px; border-radius: 10px;
            font-size: 13px; line-height: 1.6; text-align: left; display: none;
            white-space: pre-wrap; word-break: break-word;
        }
        #status.show { display: block; }
        #status.ok { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
        #status.err { background: rgba(200,16,46,0.1); border: 1px solid rgba(200,16,46,0.3); color: #ff6b6b; }
        #status.busy { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #9999a8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📖 Seed Scriptures</h1>
        <p>Click the button below to load all 251 scriptures into Firestore. This is safe to run more than once — it checks first and does nothing if scriptures already exist.</p>
        <button id="seedBtn">Seed Database</button>
        <div id="status"></div>
    </div>

    <script type="module">
        const btn = document.getElementById('seedBtn');
        const status = document.getElementById('status');

        function setStatus(text, cls) {
            status.textContent = text;
            status.className = 'show ' + cls;
        }

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = 'Seeding…';
            setStatus('Connecting to Firestore…', 'busy');

            try {
                const mod = await import('/scripts/coc-scripture-firebase.js');
                const result = await mod.seedScriptures();

                if (result.success) {
                    if (result.count) {
                        setStatus(`✅ Done! Seeded ${result.count} scriptures into Firestore.`, 'ok');
                    } else {
                        setStatus(`ℹ️ ${result.message || 'Scriptures already exist — nothing to do.'}`, 'ok');
                    }
                } else {
                    setStatus('❌ Seeding failed: ' + (result.error || 'Unknown error'), 'err');
                }
            } catch (err) {
                setStatus('❌ Error: ' + err.message, 'err');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Seed Database';
            }
        });
    </script>
</body>
</html>
